<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-US" }}">
	<head>
	{{ partial "head.html" . }}
	</head>
	<body class="page-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
    <a class="skip-link" href="#main-content">Skip to collection</a>
    {{ partial "header.html" . }}
		<div class="container">
			<main class="main" id="main-content">
			{{ block "main" . }}
			{{ end }}
			</main>
		</div>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
	</body>
</html>
