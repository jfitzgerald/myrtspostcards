<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ "" | relURL }}" aria-label="{{ .Site.Title }} home">
      <img src="{{ "images/myrts_postcards_logo_sm.png" | relURL }}" alt="{{ .Site.Title }}">
      <span class="brand__subtitle">A California family archive</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ "" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Myrtle’s Story</a>
      <a href="{{ "cards/" | relURL }}"{{ if eq .Section "cards" }} aria-current="page"{{ end }}>Collection <span>134</span></a>
    </nav>
  </div>
</header>
